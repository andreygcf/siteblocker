<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title data-i18n="appName">Site Time Tracker</title>
  <link rel="stylesheet" href="../common/ui.css" />
  <style>
    body { width: 300px; }
    .p { padding: 16px; }
    .site { font-size: 15px; font-weight: 700; margin-bottom: 2px; word-break: break-all; }
    .status { font-size: 12px; color: var(--fg-faint); margin-bottom: 14px; }
    .lines { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .line { display: flex; justify-content: space-between; align-items: baseline; }
    .line span { color: var(--fg-dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
    .line b { font-variant-numeric: tabular-nums; font-size: 15px; }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1; }
    .quick { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <div class="p">
    <div class="site" id="site">—</div>
    <div class="status" id="status"></div>
    <div class="lines" id="lines" hidden>
      <div class="line"><span data-i18n="popupSession"></span><b id="session">—</b></div>
      <div class="line"><span data-i18n="popupToday"></span><b id="today">—</b></div>
      <div class="line"><span data-i18n="popupMonth"></span><b id="month">—</b></div>
      <div class="line"><span data-i18n="popupTotal"></span><b id="total">—</b></div>
    </div>
    <div class="actions">
      <button id="stats" class="primary" data-i18n="btnStats"></button>
      <button id="options" data-i18n="btnOptions"></button>
    </div>
    <div class="quick" id="quick" hidden>
      <div class="row">
        <button id="addWaste" style="flex:1" data-i18n="popupAddWaste"></button>
        <button id="addStats" style="flex:1" data-i18n="popupAddStats"></button>
      </div>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
